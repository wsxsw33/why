<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>단 하나의 왜</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            background-image: url("images/universe.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 6vh 5vw;

            background-color: rgba(0, 0, 0, 0.75);
        }

        .landing {
            width: min(900px, 94vw);
            text-align: center;
        }

        .title-wrap {
            position: relative;
            width: min(760px, 92vw);
            margin: 0 auto 6vh auto;
        }

        .title-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .why-image {
            position: absolute;
            left: 50%;
            top: 50%;
            width: clamp(110px, 16vw, 180px);
            transform: translate(-50%, -50%);

            opacity: 0;
            animation: fadeInWhy 4s ease-in-out forwards;
        }

        .menu-area {
            opacity: 0;
            animation: fadeInMenu 2s ease-in-out forwards;
            animation-delay: 4.5s;
        }

        .menu-link {
            display: block;
            width: fit-content;
            max-width: 94vw;
            margin: 0 auto 1.2vh auto;

            text-decoration: none;
            cursor: pointer;

            transition:
                transform 0.3s ease,
                filter 0.3s ease,
                opacity 0.3s ease;
        }

        .menu-link:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 0 10px rgba(102, 255, 153, 0.45));
        }

        .menu-link:active {
            transform: scale(0.98);
            opacity: 0.8;
        }

        .menu-image {
            width: min(660px, 86vw);
            height: auto;
            display: block;
        }

        .question-wrap {
            margin-top: 7vh;

            opacity: 0;
            animation: fadeInQuestion 3s ease-in-out forwards;
            animation-delay: 7s;
        }

        .question-image {
            width: min(640px, 86vw);
            height: auto;
        }

        @keyframes fadeInWhy {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInMenu {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInQuestion {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* 모바일 세로 */
        @media (max-width: 768px) and (orientation: portrait) {
            .page {
                align-items: center;
                padding: 5vh 4vw;
            }

            .landing {
                width: 96vw;
            }

            .title-wrap {
                width: 94vw;
                margin-bottom: 5vh;
            }

            .why-image {
                width: clamp(90px, 24vw, 130px);
            }

            .menu-link {
                margin-bottom: 0.8vh;
            }

            .menu-image {
                width: 92vw;
            }

            .question-wrap {
                margin-top: 5vh;
            }

            .question-image {
                width: 90vw;
            }
        }

        /* 모바일 가로 */
        @media (max-height: 520px) and (orientation: landscape) {
            .page {
                align-items: flex-start;
                padding: 4vh 4vw;
                overflow-y: auto;
            }

            .landing {
                width: 92vw;
            }

            .title-wrap {
                width: min(560px, 70vw);
                margin-bottom: 3vh;
            }

            .why-image {
                width: clamp(80px, 11vw, 120px);
            }

            .menu-link {
                margin-bottom: 0.4vh;
            }

            .menu-image {
                width: min(470px, 70vw);
            }

            .question-wrap {
                margin-top: 3vh;
            }

            .question-image {
                width: min(460px, 70vw);
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="landing">

            <div class="title-wrap">
                <img src="images/단 하나.png"
                     alt="단 하나의 를 위하여..."
                     class="title-image">

                <img src="images/why.png"
                     alt="왜?"
                     class="why-image">
            </div>

            <nav class="menu-area">

                <a href="#"
                   class="menu-link">
                    <img src="images/우주해탈(宇宙解脫) 연구소.png"
                         alt="우주해탈(宇宙解脫) 연구소"
                         class="menu-image">
                </a>

                <a href="#"
                   class="menu-link">
                    <img src="images/획분석 한자(劃分析 韓字) 연구소.png"
                         alt="획분석 한자(劃分析 韓字) 연구소"
                         class="menu-image">
                </a>

                <a href="#"
                   class="menu-link">
                    <img src="images/마음(心)으로 하나되기.png"
                         alt="마음(心)으로 하나되기"
                         class="menu-image">
                </a>

            </nav>

            <div class="question-wrap">
                <img src="images/우리는 과연 깨어날 수 있을까.png"
                     alt="우리는 과연 깨어날 수 있을까?"
                     class="question-image">
            </div>

        </section>

    </main>

</body>

</html>
