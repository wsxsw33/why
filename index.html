<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단 하나의 왜</title>

    <style>
        body {
            margin: 0;
            background-image: url("images/universe.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow: hidden;
        }

        .page {
            width: 100vw;
            height: 100vh;
            position: relative;
            background-color: rgba(0, 0, 0, 0.75);
        }

        .intro-text {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 760px;
            max-width: 90vw;
            transform: translate(-50%, -50%);
            text-align: center;
            transition: all 2s ease;
        }

        .intro-text.move-up {
            top: 14%;
            transform: translate(-50%, -50%) scale(0.9);
        }

        .title-image {
            width: 100%;
            height: auto;
            vertical-align: middle;
        }

        .why-image {
            position: absolute;
            left: 50%;
            top: 30%;
            width: 180px;
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: fadeInWhy 5s ease-in-out forwards;
        }

        .menu-page {
            position: absolute;
            top: 30%;
            left: 50%;
            width: 100%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .menu-page.show {
            opacity: 1;
        }

        .menu-item {
            padding: 4px;
            white-space: nowrap;
        }

        .menu-image {
            width: 660px;
            max-width: 85vw;
            height: auto;
        }

        .awake-question {
            margin-top: 60px;
            opacity: 0;
            transition: opacity 3s ease;
        }

        .awake-question.show {
            opacity: 1;
        }

        .question-image {
            width: 640px;
            max-width: 85vw;
            height: auto;
        }

        @keyframes fadeInWhy {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .intro-text {
                width: 92vw;
            }

            .intro-text.move-up {
                top: 14%;
                transform: translate(-50%, -50%) scale(0.95);
            }

            .why-image {
                width: 24vw;
                max-width: 130px;
            }

            .menu-page {
                top: 28%;
                width: 100%;
            }

            .menu-item {
                padding: 4px;
            }

            .menu-image {
                width: 92vw;
                max-width: 660px;
            }

            .awake-question {
                margin-top: 40px;
            }

            .question-image {
                width: 92vw;
                max-width: 640px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div id="mainTitle" class="intro-text">
            <img src="images/단 하나.png"
                 alt="단 하나의 를 위하여..."
                 class="title-image">

            <img src="images/why.png"
                 alt="왜?"
                 class="why-image">
        </div>

        <div id="menuPage" class="menu-page">

            <div class="menu-item">
                <img src="images/우주해탈(宇宙解脫) 연구소.png"
                     alt="우주해탈(宇宙解脫) 연구소"
                     class="menu-image">
            </div>

            <div class="menu-item">
                <img src="images/획분석 한자(劃分析 韓字) 연구소.png"
                     alt="획분석 한자(劃分析 韓字) 연구소"
                     class="menu-image">
            </div>

            <div class="menu-item">
                <img src="images/마음(心)으로 하나되기.png"
                     alt="마음(心)으로 하나되기"
                     class="menu-image">
            </div>

            <div id="awakeQuestion" class="awake-question">
                <img src="images/우리는 과연 깨어날 수 있을까.png"
                     alt="우리는 과연 깨어날 수 있을까?"
                     class="question-image">
            </div>

        </div>

    </div>

    <script>
        window.onload = function () {
            const title = document.getElementById("mainTitle");
            const menu = document.getElementById("menuPage");
            const awakeQuestion = document.getElementById("awakeQuestion");

            setTimeout(function () {
                title.classList.add("move-up");

                setTimeout(function () {
                    menu.classList.add("show");

                    setTimeout(function () {
                        awakeQuestion.classList.add("show");
                    }, 2500);

                }, 2000);

            }, 2000);
        };
    </script>

</body>

</html>
