<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단 하나의 왜</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage {
            width: 1600px;
            height: 900px;
            position: relative;
            overflow: hidden;

            background-image: url("images/universe.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            transform: scale(var(--scale));
            transform-origin: center center;
        }

        .stage::before {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.75);
        }

        .intro-text {
            position: absolute;
            top: 450px;
            left: 50%;
            width: 760px;
            transform: translate(-50%, -50%);
            text-align: center;
            transition: all 2s ease;
            z-index: 2;
        }

        .intro-text.move-up {
            top: 140px;
            transform: translate(-50%, -50%) scale(0.9);
        }

        .title-image {
            width: 100%;
            height: auto;
        }

        .why-image {
            position: absolute;
            left: 50%;
            top: 30%;
            width: 180px;
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: fadeInWhy 5s ease-in-out forwards;
        }

        .menu-page {
            position: absolute;
            top: 270px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 2;
        }

        .menu-page.show {
            opacity: 1;
        }

        .menu-item {
            padding: 4px;
            white-space: nowrap;
        }

        .menu-image {
            width: 660px;
            height: auto;
        }

        .awake-question {
            margin-top: 60px;
            opacity: 0;
            transition: opacity 3s ease;
        }

        .awake-question.show {
            opacity: 1;
        }

        .question-image {
            width: 640px;
            height: auto;
        }

        @keyframes fadeInWhy {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="stage" id="stage">

        <div id="mainTitle" class="intro-text">
            <img src="images/단 하나.png"
                 alt="단 하나의 를 위하여..."
                 class="title-image">

            <img src="images/why.png"
                 alt="왜?"
                 class="why-image">
        </div>

        <div id="menuPage" class="menu-page">

            <div class="menu-item">
                <img src="images/우주해탈(宇宙解脫) 연구소.png"
                     alt="우주해탈(宇宙解脫) 연구소"
                     class="menu-image">
            </div>

            <div class="menu-item">
                <img src="images/획분석 한자(劃分析 韓字) 연구소.png"
                     alt="획분석 한자(劃分析 韓字) 연구소"
                     class="menu-image">
            </div>

            <div class="menu-item">
                <img src="images/마음(心)으로 하나되기.png"
                     alt="마음(心)으로 하나되기"
                     class="menu-image">
            </div>

            <div id="awakeQuestion" class="awake-question">
                <img src="images/우리는 과연 깨어날 수 있을까.png"
                     alt="우리는 과연 깨어날 수 있을까?"
                     class="question-image">
            </div>

        </div>

    </div>

    <script>
        function resizeStage() {
            const baseWidth = 1600;
            const baseHeight = 900;

            const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;

            const scale = Math.min(vw / baseWidth, vh / baseHeight);

            document.documentElement.style.setProperty("--scale", scale);
        }

        window.addEventListener("resize", resizeStage);

        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", resizeStage);
        }

        window.onload = function () {
            resizeStage();

            const title = document.getElementById("mainTitle");
            const menu = document.getElementById("menuPage");
            const awakeQuestion = document.getElementById("awakeQuestion");

            setTimeout(function () {
                title.classList.add("move-up");

                setTimeout(function () {
                    menu.classList.add("show");

                    setTimeout(function () {
                        awakeQuestion.classList.add("show");
                    }, 2500);

                }, 2000);

            }, 2000);
        };
    </script>

</body>

</html>
